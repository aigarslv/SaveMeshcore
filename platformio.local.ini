; SaveMeshcore build fixes for upstream board configs.
;
; PlatformIO loads this file last (see extra_configs in platformio.ini), so these
; sections reliably override the upstream variant files, which stay unmodified.
; Upstream ignores platformio.local.ini in git, so release merges never conflict.

; Remove an entry once upstream fixes it.
;
; Upstream 1.18.0: the repeater build omits EnvironmentSensorManager.cpp,
; which variants/thinknode_m8/target.cpp needs, so linking fails. The
; companion builds for this board already include it.
[env:ThinkNode_M8_repeater]
build_src_filter = ${ThinkNode_M8.build_src_filter}
  +<helpers/sensors/EnvironmentSensorManager.cpp>
  +<../examples/simple_repeater/*.cpp>
