name: SaveMeshcore Repeater Release

# Builds every repeater firmware target and publishes a GitHub release for a
# tag named repeater-vX.Y.Z-savemesh, where vX.Y.Z is the official MeshCore
# repeater release the build is based on.
#
# Runs when such a tag is pushed, when started manually, or when called by the
# "Sync upstream repeater release" workflow after it merges a new release.

on:
  push:
    tags:
      - 'repeater-v*-savemesh'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag, for example repeater-v1.18.0-savemesh'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: savemesh-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^repeater-v[0-9]+\.[0-9]+\.[0-9]+-savemesh$ ]]; then
            echo "Tag '$tag' is not of the form repeater-vX.Y.Z-savemesh" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#repeater-}" >> "$GITHUB_OUTPUT"

      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: List repeater targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          targets=$(bash build.sh get-repeater-firmwares-to-build | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Repeater targets: $(echo "$targets" | jq length)"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    continue-on-error: true   # one board failing must not block the others
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.target }}
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: SaveMeshcore Repeater Firmware ${{ needs.prepare.outputs.version }}
          draft: false
          make_latest: true
          body: |
            Official MeshCore repeater firmware ${{ needs.prepare.outputs.version }} with the SaveMeshcore filters (`filter 1byte`, `filter data`, `filter public`).
            See the README for commands and defaults. Repeater firmware only.
          files: out/*
