name: SaveMeshcore Repeater Release

# Builds every repeater target and publishes only after every target succeeds.
# Accepted tags:
#   repeater-vX.Y.Z-savemesh
#   repeater-vX.Y.Z-savemesh.N  (SaveMeshcore patch revision)

on:
  push:
    tags:
      - 'repeater-v*-savemesh*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, for example repeater-v1.18.0-savemesh.1'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        required: true
        type: string

# Build jobs must not be able to change the repository.
permissions:
  contents: read

concurrency:
  group: savemesh-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
      targets: ${{ steps.targets.outputs.targets }}
      complete: ${{ steps.draft.outputs.complete }}
    steps:
      - name: Resolve release tag
        id: tag
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [[ -z "$tag" && "$REF_TYPE" == "tag" ]]; then
            tag="$REF_NAME"
          fi
          if [[ ! "$tag" =~ ^repeater-v[0-9]+\.[0-9]+\.[0-9]+-savemesh(\.[1-9][0-9]*)?$ ]]; then
            echo "Tag '$tag' must be repeater-vX.Y.Z-savemesh or repeater-vX.Y.Z-savemesh.N" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#repeater-}" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag)' \
            | head -n 1)
          if [[ -n "$release" ]]; then
            if [[ "$(jq -r .draft <<< "$release")" != 'true' ]]; then
              echo "$RELEASE_TAG is already published; published releases are immutable." >&2
              exit 1
            fi
            echo "Found draft $RELEASE_TAG; this run will resume it."
          fi

      - name: Check out tagged source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.tag.outputs.tag }}
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: List repeater targets
        id: targets
        shell: bash
        run: |
          set -euo pipefail
          targets=$(bash build.sh get-repeater-firmwares-to-build | jq -R -s -c 'split("\n") | map(select(length > 0))')
          count=$(echo "$targets" | jq length)
          if [[ "$count" -eq 0 ]]; then
            echo 'No repeater targets found.' >&2
            exit 1
          fi
          echo "Repeater targets: $count"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      # A retry must not rebuild everything when the draft already holds the
      # manifest (uploaded last) and at least one file for every target.
      - name: Check whether an existing draft is already complete
        id: draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          TARGETS_JSON: ${{ steps.targets.outputs.targets }}
        run: |
          set -euo pipefail
          names=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft) | .assets[].name')
          complete=false
          if grep -qx 'SHA256SUMS.txt' <<< "$names"; then
            complete=true
            while read -r target; do
              if ! grep -q "^${target}-" <<< "$names"; then complete=false; fi
            done < <(jq -r '.[]' <<< "$TARGETS_JSON")
          fi
          echo "Draft complete: $complete"
          echo "complete=$complete" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.complete != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.prepare.outputs.targets) }}
    steps:
      - name: Check out tagged source without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.tag }}
          persist-credentials: false

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.target }}
        env:
          FIRMWARE_VERSION: ${{ needs.prepare.outputs.version }}
        run: bash build.sh build-firmware ${{ matrix.target }}

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: out
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.build.result == 'success' || (needs.build.result == 'skipped' && needs.prepare.outputs.complete == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all firmware
        if: needs.prepare.outputs.complete != 'true'
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: out

      - name: Verify every target and create manifest
        if: needs.prepare.outputs.complete != 'true'
        shell: bash
        env:
          TARGETS_JSON: ${{ needs.prepare.outputs.targets }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          targets = json.loads(os.environ['TARGETS_JSON'])
          files = sorted(p for p in Path('out').iterdir() if p.is_file())
          missing = [t for t in targets if not any(p.name.startswith(t + '-') for p in files)]
          if missing:
              raise SystemExit('Missing firmware for: ' + ', '.join(missing))

          with open('out/SHA256SUMS.txt', 'w') as manifest:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  manifest.write(f'{digest}  {path.name}\n')
          print(f'Verified {len(targets)} targets and {len(files)} firmware files.')
          PY

      # Use a draft as the upload transaction. Only missing assets are
      # uploaded, and the manifest goes last so its presence marks the draft
      # as complete. A failed run leaves an unpublished draft for the retry.
      - name: Upload missing assets to draft
        if: needs.prepare.outputs.complete != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_NAME: SaveMeshcore Repeater Firmware ${{ needs.prepare.outputs.version }}
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag and .draft)' | head -n 1)
          if [[ -z "$release" ]]; then
            body="Official MeshCore repeater firmware ${RELEASE_VERSION} with the SaveMeshcore filters (\`filter 1byte\`, \`filter data\`, \`filter public\`).
          See the README for commands, enforced settings, and defaults. Repeater firmware only."
            release=$(gh api -X POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="$RELEASE_TAG" -f name="$RELEASE_NAME" -f body="$body" \
              -F draft=true -F make_latest=false)
          fi
          release_id=$(jq -r .id <<< "$release")
          existing=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100" --jq '.[].name')

          upload() {
            local file="$1" name
            name=$(basename "$file")
            if grep -qxF "$name" <<< "$existing"; then return 0; fi
            for attempt in 1 2 3 4 5; do
              if gh api -X POST "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${name}" \
                  -H 'Content-Type: application/octet-stream' --input "$file" > /dev/null; then
                sleep 1
                return 0
              fi
              echo "Upload of $name failed (attempt $attempt); retrying." >&2
              sleep $((attempt * 10))
            done
            echo "Giving up on $name." >&2
            return 1
          }

          for file in out/*; do
            [[ "$(basename "$file")" == 'SHA256SUMS.txt' ]] && continue
            upload "$file"
          done
          upload out/SHA256SUMS.txt

      - name: Publish verified release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          release_id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg tag "$RELEASE_TAG" '.[] | select(.tag_name == $tag) | .id' \
            | head -n 1)
          if [[ -z "$release_id" ]]; then
            echo "Draft $RELEASE_TAG was not found after upload." >&2
            exit 1
          fi
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
            -F draft=false -F prerelease=false -f make_latest=true > /dev/null
          echo "Published ${RELEASE_TAG}."
