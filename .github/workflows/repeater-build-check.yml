name: Repeater Build Check

# SaveMeshcore ships repeater firmware only. This replaces the upstream
# PR Build Check (which also builds companion and room-server firmware).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - Heltec_v3_repeater          # ESP32-S3
          - RAK_4631_repeater           # nRF52
          - RAK_4631_repeater_ethernet  # nRF52 + Ethernet
          - PicoW_repeater              # RP2040
          - wio-e5-mini_repeater        # STM32
          - LilyGo_Tlora_C6_repeater_   # ESP32-C6
          - wio_wm1110_repeater         # LR1110 (nRF52)
          - Tbeam_SX1276_repeater       # SX1276 (ESP32)
          - ThinkNode_M8_repeater       # nRF52, uses variants/zz_savemesh_overrides

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}
