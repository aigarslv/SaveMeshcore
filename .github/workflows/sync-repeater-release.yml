name: Sync upstream repeater release

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

# Validation executes newly merged upstream code, so it is read-only. Only the
# small publish job can push after reproducing the validated tree exactly.
permissions:
  contents: read

concurrency:
  group: sync-upstream-repeater-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.release.outputs.base_sha }}
      release_tag: ${{ steps.release.outputs.tag }}
      update: ${{ steps.release.outputs.update }}
      tree: ${{ steps.candidate.outputs.tree }}
    steps:
      - name: Check out patched release branch without write credentials
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Find latest official repeater release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch --force upstream '+refs/tags/repeater-v*:refs/tags/repeater-v*'

          latest_tag="$({
            git tag --list 'repeater-v*' \
              | sed -nE '/^repeater-v[0-9]+\.[0-9]+\.[0-9]+$/p' \
              | sort -V
          } | tail -n 1)"

          if [[ -z "$latest_tag" ]]; then
            echo 'No official repeater release tag was found.' >&2
            exit 1
          fi

          echo "Latest official repeater release: $latest_tag"
          echo "base_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Stop if upstream now implements these filters
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          pattern='filter_1byte|filter_data|filter_public|filter 1byte|filter data|filter public'
          if git grep -Ei "$pattern" "$RELEASE_TAG" -- src examples; then
            echo 'The upstream release appears to provide packet filters.' >&2
            echo 'Automatic synchronization stopped to avoid combining two implementations.' >&2
            exit 1
          fi

      - name: Stop if upstream allocates a reserved filtered payload type
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          definitions=$(git show "${RELEASE_TAG}:src/Packet.h")
          pattern='PAYLOAD_TYPE_[A-Za-z0-9_]+[[:space:]]+0x0[C-Ec-e]|0x0[C-Ec-e][[:space:]].*PAYLOAD_TYPE_'
          if grep -En "$pattern" <<< "$definitions"; then
            echo 'Upstream allocated payload type 0x0C, 0x0D, or 0x0E.' >&2
            echo 'SaveMeshcore blocks these IDs; review the allocation before updating.' >&2
            exit 1
          fi

      - name: Build candidate merge
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$RELEASE_TAG"

      - name: Set up build environment
        if: steps.release.outputs.update == 'true'
        uses: ./.github/actions/setup-build-environment

      - name: Build representative repeater firmware
        if: steps.release.outputs.update == 'true'
        run: pio run -e Heltec_v3_repeater

      - name: Record validated candidate tree
        id: candidate
        shell: bash
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

  validate-builds:
    # One target per platform family (ESP32, nRF52, RP2040, STM32) so a merge
    # that breaks a non-ESP32 build is caught before main is updated.
    needs: validate
    if: needs.validate.outputs.update == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - ThinkNode_M8_repeater
          - RAK_4631_repeater
          - PicoW_repeater
          - wio-e5-mini_repeater
    steps:
      - name: Check out base commit without write credentials
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Merge the official release
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch --force upstream "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$RELEASE_TAG"

      - name: Set up build environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

  publish:
    needs: [validate, validate-builds]
    if: ${{ !cancelled() && needs.validate.result == 'success' && (needs.validate-builds.result == 'success' || needs.validate-builds.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_needed: ${{ steps.release.outputs.needed }}
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      # This job runs no project build code. Its credential can only reproduce
      # and publish the exact tree validated in the read-only job.
      - name: Check out current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Reproduce and publish validated tree
        shell: bash
        env:
          BASE_SHA: ${{ needs.validate.outputs.base_sha }}
          EXPECTED_TREE: ${{ needs.validate.outputs.tree }}
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
          UPDATE: ${{ needs.validate.outputs.update }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$BASE_SHA" ]]; then
            echo 'main changed during validation; the next sync will retry.' >&2
            exit 1
          fi

          if [[ "$UPDATE" == 'true' ]]; then
            git remote add upstream https://github.com/meshcore-dev/MeshCore.git
            git fetch --force upstream "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git merge --no-edit "$RELEASE_TAG"
          fi

          actual_tree=$(git rev-parse 'HEAD^{tree}')
          if [[ "$actual_tree" != "$EXPECTED_TREE" ]]; then
            echo "Candidate tree mismatch: expected $EXPECTED_TREE, got $actual_tree" >&2
            exit 1
          fi

          if [[ "$UPDATE" == 'true' ]]; then
            git push origin HEAD:main
          fi

      - name: Ensure release tag exists and decide whether to build
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_TAG: ${{ needs.validate.outputs.release_tag }}
        run: |
          set -euo pipefail
          release_tag="${UPSTREAM_TAG}-savemesh"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

          # Any published SaveMeshcore release of this upstream version
          # (-savemesh or -savemesh.N) means there is nothing to do.
          pattern="^$(printf '%s' "$UPSTREAM_TAG" | sed 's/[.]/\\./g')-savemesh(\\.[0-9]+)?$"
          published=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -r --arg re "$pattern" '.[] | select((.draft | not) and (.tag_name | test($re))) | .tag_name' \
            | head -n 1)
          if [[ -n "$published" ]]; then
            echo "$UPSTREAM_TAG already has published release $published."
            echo 'needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git ls-remote --exit-code --tags origin "refs/tags/$release_tag" > /dev/null; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$release_tag" -m "Official $UPSTREAM_TAG with SaveMeshcore filters"
            git push origin "refs/tags/$release_tag"
            echo "Created $release_tag."
          fi

          release=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            | jq -c --arg tag "$release_tag" '.[] | select(.tag_name == $tag)' \
            | head -n 1)
          if [[ -n "$release" ]]; then
            if [[ "$(jq -r .draft <<< "$release")" == 'true' ]]; then
              echo 'Existing release is still a draft; retrying its build.'
              echo 'needed=true' >> "$GITHUB_OUTPUT"
            else
              echo "$release_tag is already published."
              echo 'needed=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'No release exists; starting its build.'
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  release:
    needs: publish
    if: needs.publish.outputs.release_needed == 'true'
    uses: ./.github/workflows/savemesh-release.yml
    with:
      tag: ${{ needs.publish.outputs.release_tag }}
    permissions:
      contents: write
