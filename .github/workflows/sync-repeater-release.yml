name: Sync upstream repeater release

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-repeater-release
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
      release_tag: ${{ steps.publish.outputs.release_tag }}
    steps:
      - name: Check out patched release branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Find latest official repeater release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          git remote add upstream https://github.com/meshcore-dev/MeshCore.git
          git fetch --force upstream '+refs/tags/repeater-v*:refs/tags/repeater-v*'

          latest_tag="$({
            git tag --list 'repeater-v*' \
              | sed -nE '/^repeater-v[0-9]+\.[0-9]+\.[0-9]+$/p' \
              | sort -V
          } | tail -n 1)"

          if [[ -z "$latest_tag" ]]; then
            echo 'No official repeater release tag was found.' >&2
            exit 1
          fi

          echo "Latest official repeater release: $latest_tag"
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"

          if git merge-base --is-ancestor "$latest_tag" HEAD; then
            echo 'update=false' >> "$GITHUB_OUTPUT"
          else
            echo 'update=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an upstream filter implementation
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          pattern='filter_1byte|filter_data|filter_public|filter 1byte|filter data|filter public'
          if git grep -Ei "$pattern" "$RELEASE_TAG" -- src examples; then
            echo 'The upstream release appears to provide packet filters.' >&2
            echo 'Automatic synchronization stopped to avoid combining two filter implementations.' >&2
            echo 'Review the upstream filters and migrate users to clean upstream firmware.' >&2
            exit 1
          fi

      - name: Merge official repeater release
        if: steps.release.outputs.update == 'true'
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-edit "$RELEASE_TAG"

      - name: Set up build environment
        if: steps.release.outputs.update == 'true'
        uses: ./.github/actions/setup-build-environment

      - name: Build representative repeater firmware
        if: steps.release.outputs.update == 'true'
        run: pio run -e Heltec_v3_repeater

      - name: Publish patched release
        if: steps.release.outputs.update == 'true'
        run: git push origin HEAD:main

      # Runs on every sync, not only after a merge: if an earlier run updated
      # main but failed to push the tag, this run creates the missing tag.
      - name: Tag release if missing
        id: publish
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          release_tag="${RELEASE_TAG}-savemesh"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" > /dev/null; then
            echo "$release_tag already exists."
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$release_tag" -m "Official $RELEASE_TAG with SaveMeshcore filters"
          git push origin "refs/tags/$release_tag"
          echo "Created $release_tag."
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Tags pushed with GITHUB_TOKEN do not start other workflows, so the release
  # build is called directly here.
  release:
    needs: sync
    if: needs.sync.outputs.published == 'true'
    uses: ./.github/workflows/savemesh-release.yml
    with:
      tag: ${{ needs.sync.outputs.release_tag }}
    permissions:
      contents: write
